name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop-windows:
    name: Build installeur Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend + Electron
        working-directory: frontend
        run: |
          npm ci
          npm install @rolldown/binding-win32-x64-msvc lightningcss-win32-x64-msvc --no-save
          npm run desktop:build

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: GLOBE Manager ${{ github.ref_name }}
          body: |
            ## Installation

            1. Installer **MySQL** sur le PC serveur (https://dev.mysql.com/downloads/installer/)
            2. Créer une base de données `gestion_residence`
            3. Télécharger et lancer l'installeur `.exe`
            4. Configurer la connexion MySQL au premier lancement
          files: |
            frontend/release/*.exe
