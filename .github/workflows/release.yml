name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  backend-image:
    name: Build & publish image Docker backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/romaric-creator/globeapp/backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build & push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop-windows:
    name: Build installeur Windows
    runs-on: windows-latest
    needs: backend-image

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./frontend/src-tauri

      - name: Installer les dependances Node
        working-directory: frontend
        run: npm ci

      - name: Build desktop Windows
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: GLOBE Manager ${{ github.ref_name }}
          body: |
            ## Installation

            1. Installer **Docker Desktop** (si pas déjà fait) : https://www.docker.com/products/docker-desktop
            2. Télécharger et lancer `GLOBE_Manager_${{ github.ref_name }}_x64-setup.exe`
            3. L'application démarre automatiquement à chaque lancement.
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
