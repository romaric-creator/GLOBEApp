name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gestion_residence_test
          MYSQL_USER: globe
          MYSQL_PASSWORD: globe_secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u globe -pglobe_secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql://globe:globe_secret@localhost:3306/gestion_residence_test
      JWT_SECRET: test-secret-ci
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npx prisma generate

      - name: Appliquer le schema (db push)
        run: npx prisma db push --force-reset --skip-generate

      - name: Linter
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Tests unitaires
        run: npm run test -- --forceExit --coverage

      - name: Tests e2e
        run: npm run test:e2e -- --forceExit

      - name: Upload couverture backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload couverture frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/

  desktop-windows:
    name: Desktop Windows (.exe)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./frontend/src-tauri

      - name: Installer les dependances Node
        run: npm ci

      - name: Build desktop Windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Upload installeur Windows
        uses: actions/upload-artifact@v4
        with:
          name: globe-manager-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
