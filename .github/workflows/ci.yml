name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gestion_residence_test
          MYSQL_USER: globe
          MYSQL_PASSWORD: globe_secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u globe -pglobe_secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: mysql://globe:globe_secret@localhost:3306/gestion_residence_test
      JWT_SECRET: test-secret-ci
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Generer le client Prisma
        run: npx prisma generate

      - name: Appliquer le schema (db push)
        run: npx prisma db push --force-reset --skip-generate

      - name: Linter
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Tests unitaires
        run: npm run test -- --forceExit --coverage

      - name: Tests e2e
        run: npm run test:e2e -- --forceExit

      - name: Upload couverture backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage/

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload couverture frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/

  desktop-windows:
    name: Desktop Windows (.exe)
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend + Electron
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:3001/api
        run: |
          npm ci
          npm install @rolldown/binding-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save
          npm run desktop:build

      - name: Upload installeur Windows
        uses: actions/upload-artifact@v4
        with:
          name: globe-manager-windows
          path: frontend/release/*.exe
          retention-days: 30

  desktop-linux:
    name: Desktop Linux (.AppImage)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend + Electron
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:3001/api
        run: |
          npm ci
          npm run desktop:build

      - name: Upload AppImage Linux
        uses: actions/upload-artifact@v4
        with:
          name: globe-manager-linux
          path: frontend/release/*.AppImage
          retention-days: 30
