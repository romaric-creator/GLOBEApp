services:
  mysql:
    image: mysql:8.0
    container_name: globe_manager_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gestion_residence
      MYSQL_USER: globe
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-globe_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u globe -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globe_manager_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - backups_data:/backups
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://globe:${MYSQL_PASSWORD:-globe_secret}@mysql:3306/gestion_residence
      JWT_SECRET: ${JWT_SECRET:-globe-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SYNC_REMOTE_URL: ${SYNC_REMOTE_URL:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: globe_manager_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backups_data:
