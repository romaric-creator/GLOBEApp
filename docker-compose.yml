services:
  mysql:
    image: mysql:8.0
    container_name: globe_manager_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_residence
      MYSQL_USER: globe
      MYSQL_PASSWORD: globe_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "globe", "-pglobe_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: globe_manager_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: mysql://globe:globe_secret@mysql:3306/gestion_residence
      JWT_SECRET: ${JWT_SECRET:-globe-super-secret-key-change-in-production}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      SYNC_REMOTE_URL: ${SYNC_REMOTE_URL:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
