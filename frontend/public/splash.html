<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GLOBE Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 520px;
      min-height: 340px;
      background: #0e0c09;
      color: #e8e0d0;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(201,168,76,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.055) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.1) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 100%, rgba(140,100,20,0.07) 0%, transparent 50%);
    }

    /* ── VERSION ─────────────────────────────────────────────── */
    .version {
      position: absolute;
      top: 15px;
      right: 18px;
      font-size: 10px;
      color: rgba(201,168,76,0.35);
      letter-spacing: 0.6px;
      z-index: 10;
    }

    /* ── LOADING VIEW ────────────────────────────────────────── */
    #loading-view {
      position: relative;
      z-index: 1;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 48px 32px;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 22px;
    }

    .logo-glow {
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.22) 0%, transparent 68%);
      animation: glow-pulse 2.6s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.88); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    .logo-img {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      display: block;
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.18),
        0 8px 30px rgba(0,0,0,0.55),
        0 2px 8px rgba(201,168,76,0.15);
    }

    .app-name {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #f5ede0;
      margin-bottom: 5px;
    }

    .app-sub {
      font-size: 10px;
      color: rgba(201,168,76,0.55);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 34px;
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      max-width: 330px;
    }

    .bar-track {
      width: 100%;
      height: 2px;
      background: rgba(201,168,76,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }

    .bar-fill {
      position: absolute;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,168,76,0.4) 20%,
        #C9A84C 50%,
        rgba(232,195,100,0.9) 65%,
        #C9A84C 80%,
        transparent 100%);
      animation: bar-move 2s ease-in-out infinite;
    }

    @keyframes bar-move {
      0%   { left: -60%; width: 50%; }
      100% { left: 110%; width: 50%; }
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 18px;
      margin-bottom: 10px;
    }

    #status {
      font-size: 11.5px;
      color: rgba(232,224,208,0.45);
    }

    #elapsed {
      font-size: 10px;
      color: rgba(201,168,76,0.35);
      white-space: nowrap;
    }

    .log-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .details-toggle {
      font-size: 10px;
      color: rgba(201,168,76,0.35);
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: color 0.15s;
    }
    .details-toggle:hover { color: rgba(201,168,76,0.75); }

    .copy-btn {
      font-size: 10px;
      color: rgba(201,168,76,0.25);
      cursor: pointer;
      transition: color 0.15s;
    }
    .copy-btn:hover { color: #C9A84C; }

    .log-panel {
      display: none;
      width: 100%;
      margin-top: 8px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(201,168,76,0.1);
      border-radius: 7px;
      padding: 8px 10px;
      max-height: 110px;
      overflow-y: auto;
      user-select: text;
    }
    .log-panel.visible { display: block; }

    .log-line {
      font-size: 9.5px;
      color: rgba(232,224,208,0.38);
      line-height: 1.65;
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }
    .log-line .ts {
      color: rgba(201,168,76,0.28);
      margin-right: 6px;
    }

    /* ── SETUP OVERLAY ───────────────────────────────────────── */
    @keyframes fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #setup-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      animation: fadein 0.3s ease;
    }
    #setup-overlay.visible { display: flex; }

    .setup-card {
      width: 100%;
      background: rgba(22,18,12,0.92);
      border: 1px solid rgba(201,168,76,0.22);
      border-radius: 16px;
      padding: 26px 26px 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08);
      position: relative;
      overflow: hidden;
    }

    .setup-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
    }

    .setup-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
    }

    .setup-logo {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,168,76,0.15);
    }

    .setup-titles h2 {
      font-size: 14px;
      font-weight: 700;
      color: #f5ede0;
      letter-spacing: -0.2px;
    }

    .setup-titles p {
      font-size: 10px;
      color: rgba(201,168,76,0.55);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }

    .setup-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18), transparent);
      margin-bottom: 18px;
    }

    /* Form */
    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 11px;
    }

    .form-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-field label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(201,168,76,0.6);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .form-field input {
      padding: 8px 11px;
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(201,168,76,0.12);
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #f0e8d8;
      outline: none;
      transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }
    .form-field input::placeholder { color: rgba(232,224,208,0.18); }
    .form-field input:focus {
      border-color: rgba(201,168,76,0.55);
      background: rgba(201,168,76,0.05);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.07);
    }

    /* Messages */
    .msg {
      font-size: 11px;
      border-radius: 8px;
      padding: 9px 13px;
      margin-bottom: 12px;
      display: none;
      animation: fadein 0.2s ease;
      line-height: 1.45;
    }
    .msg.visible { display: block; }
    .msg.error   { color: #ff9a8a; background: rgba(255,70,50,0.07); border: 1px solid rgba(255,70,50,0.18); }
    .msg.success { color: #80e5a0; background: rgba(80,200,120,0.07); border: 1px solid rgba(80,200,120,0.18); }

    /* Button */
    .confirm-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #C9A84C 0%, #b8932e 100%);
      color: #1a1200;
      border: none;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.12s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(201,168,76,0.25);
    }
    .confirm-btn:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(201,168,76,0.35);
    }
    .confirm-btn:active:not(:disabled) { transform: translateY(0); }
    .confirm-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }
    .confirm-btn.testing {
      background: linear-gradient(135deg, #3a3530, #2a2520);
      color: rgba(201,168,76,0.6);
      box-shadow: none;
    }

    .setup-footer {
      font-size: 9px;
      color: rgba(201,168,76,0.2);
      margin-top: 11px;
      text-align: center;
      letter-spacing: 0.2px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(201,168,76,0.2);
      border-top-color: rgba(201,168,76,0.7);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <span class="version" id="app-version">v—</span>

  <!-- Splash chargement normal -->
  <div id="loading-view">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img class="logo-img" src="logo.png" alt="GLOBE" />
    </div>
    <h1 class="app-name">GLOBE Manager</h1>
    <p class="app-sub">Résidence meublée</p>

    <div class="progress-wrap">
      <div class="bar-track"><div class="bar-fill"></div></div>

      <div class="status-row">
        <span id="status">Initialisation...</span>
        <span id="elapsed"></span>
      </div>

      <div class="log-controls">
        <span class="details-toggle" id="details-toggle" onclick="toggleDetails()">Détails ▾</span>
        <span class="copy-btn" id="copy-btn" onclick="copyLogs()">copier</span>
      </div>
      <div class="log-panel" id="log-panel"></div>
    </div>
  </div>

  <!-- Overlay configuration premier lancement -->
  <div id="setup-overlay">
    <div class="setup-card">
      <div class="setup-header">
        <img class="setup-logo" src="logo.png" alt="GLOBE" />
        <div class="setup-titles">
          <h2>Configuration initiale</h2>
          <p>Connexion à la base de données MySQL</p>
        </div>
      </div>

      <div class="setup-divider"></div>

      <div class="form-row">
        <div class="form-field" style="flex:3">
          <label for="db-host">Hôte</label>
          <input id="db-host" type="text" placeholder="localhost" value="localhost" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-field" style="flex:1.2">
          <label for="db-port">Port</label>
          <input id="db-port" type="text" placeholder="3306" value="3306" autocomplete="off" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="db-user">Utilisateur</label>
          <input id="db-user" type="text" placeholder="root" value="root" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="db-pass">Mot de passe</label>
          <input id="db-pass" type="password" placeholder="••••••" autocomplete="off" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="db-name">Base de données</label>
          <input id="db-name" type="text" placeholder="gestion_residence" value="gestion_residence" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <div class="msg error" id="setup-error"></div>
      <div class="msg success" id="setup-success"></div>

      <button class="confirm-btn" id="confirm-btn" onclick="confirmSetup()" disabled>
        Valider et démarrer
      </button>

      <p class="setup-footer">Paramètres modifiables à tout moment depuis les réglages</p>
    </div>
  </div>

  <script>
    // ── Chronomètre ──────────────────────────────────────────
    const startTime = Date.now();
    const elapsedEl = document.getElementById('elapsed');

    function updateElapsed() {
      const secs = Math.floor((Date.now() - startTime) / 1000);
      if (secs < 5) { elapsedEl.textContent = ''; return; }
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      elapsedEl.textContent = m > 0
        ? `${m} min ${String(s).padStart(2, '0')} s`
        : `${s} s`;
    }
    setInterval(updateElapsed, 1000);

    // ── Panneau détails ──────────────────────────────────────
    let detailsOpen = false;
    const logLines = [];

    function toggleDetails() {
      detailsOpen = !detailsOpen;
      document.getElementById('log-panel').classList.toggle('visible', detailsOpen);
      document.getElementById('details-toggle').textContent = detailsOpen ? 'Détails ▴' : 'Détails ▾';
    }

    function addLog(msg) {
      const secs = Math.floor((Date.now() - startTime) / 1000);
      const ts = secs < 60 ? `${secs}s` : `${Math.floor(secs/60)}m${secs%60}s`;
      logLines.push({ ts, msg });

      const panel = document.getElementById('log-panel');
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="ts">[${ts}]</span>${msg}`;
      panel.appendChild(line);
      panel.scrollTop = panel.scrollHeight;

      if (logLines.length > 3 && !detailsOpen) {
        toggleDetails();
      }
    }

    function copyLogs() {
      const text = logLines.map(l => `[${l.ts}] ${l.msg}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('copy-btn').textContent = 'copié !';
        setTimeout(() => { document.getElementById('copy-btn').textContent = 'copier'; }, 2000);
      });
    }

    function resizeSplash(height) {
      if (window.electronAPI && window.electronAPI.splashResize) {
        window.electronAPI.splashResize(520, height);
      }
    }

    ['db-host', 'db-port', 'db-user', 'db-pass', 'db-name'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        hideSetupMessages();
      });
    });

    function showSetupError(msg) {
      const el = document.getElementById('setup-error');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('setup-success').classList.remove('visible');
      resizeSplash(570);
    }

    function showSetupSuccess(msg) {
      const el = document.getElementById('setup-success');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('setup-error').classList.remove('visible');
    }

    function hideSetupMessages() {
      document.getElementById('setup-error').classList.remove('visible');
      document.getElementById('setup-success').classList.remove('visible');
      resizeSplash(510);
    }

    function setButtonState(state) {
      const btn = document.getElementById('confirm-btn');
      btn.classList.remove('testing');
      switch (state) {
        case 'idle':
          btn.disabled = false;
          btn.innerHTML = 'Valider et démarrer';
          break;
        case 'testing':
          btn.disabled = true;
          btn.classList.add('testing');
          btn.innerHTML = '<span class="spinner"></span>Test de connexion...';
          break;
        case 'saving':
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Enregistrement...';
          break;
        case 'disabled':
          btn.disabled = true;
          btn.innerHTML = 'Valider et démarrer';
          break;
      }
    }

    function buildDbUrl() {
      const host = document.getElementById('db-host').value.trim() || 'localhost';
      const port = document.getElementById('db-port').value.trim() || '3306';
      const user = document.getElementById('db-user').value.trim() || 'root';
      const pass = document.getElementById('db-pass').value.trim();
      const dbName = document.getElementById('db-name').value.trim() || 'gestion_residence';

      const portNum = parseInt(port, 10);
      if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
        return { error: 'Le port doit être un nombre entre 1 et 65535' };
      }

      return {
        url: `mysql://${user}:${encodeURIComponent(pass)}@${host}:${portNum}/${dbName}`,
        host, port: portNum, user, dbName,
      };
    }

    async function confirmSetup() {
      hideSetupMessages();

      const dbInfo = buildDbUrl();
      if (dbInfo.error) {
        showSetupError(dbInfo.error);
        return;
      }

      setButtonState('testing');

      try {
        const result = await window.electronAPI.testDbConnection(dbInfo.url);
        if (!result.ok) {
          const hint = result.error || '';
          let msg = 'Connexion à MySQL échouée.';
          if (hint.includes('ECONNREFUSED')) {
            msg += ` Impossible de joindre ${dbInfo.host}:${dbInfo.port}. Vérifiez que MySQL est démarré.`;
          } else if (hint.includes('Access denied')) {
            msg += ' Identifiants incorrects (utilisateur ou mot de passe).';
          } else if (hint.includes('Unknown database')) {
            msg += ` La base "${dbInfo.dbName}" n'existe pas. Créez-la d'abord.`;
          } else if (hint.includes('ETIMEDOUT') || hint.includes('timeout')) {
            msg += ` Délai dépassé pour ${dbInfo.host}:${dbInfo.port}. Vérifiez l'hôte et le port.`;
          } else if (hint) {
            msg += ' ' + hint;
          }
          showSetupError(msg);
          setButtonState('idle');
          return;
        }
      } catch (e) {
        showSetupError('Erreur inattendue lors du test : ' + (e.message || e));
        setButtonState('idle');
        return;
      }

      showSetupSuccess('Connexion réussie !');
      setButtonState('saving');

      const config = { mode: 'server', configured: true, database_url: dbInfo.url, port: 3001 };

      try {
        if (window.electronAPI) {
          window.electronAPI.setupComplete(config);
        }
        document.getElementById('setup-overlay').classList.remove('visible');
        document.getElementById('status').textContent = 'Configuration enregistrée...';
        addLog('Configuration enregistrée');
      } catch (e) {
        showSetupError('Impossible de sauvegarder : ' + (e.message || e));
        setButtonState('idle');
      }
    }
  </script>

  <script>
    const statusEl = document.getElementById('status');

    if (window.electronAPI) {
      window.electronAPI.getVersion().then(v => {
        document.getElementById('app-version').textContent = 'v' + v;
      }).catch(() => {});

      window.electronAPI.onSplashStatus((msg) => {
        statusEl.textContent = msg;
        addLog(msg);
      });

      window.electronAPI.onSplashDetail((msg) => {
        addLog(msg);
      });

      window.electronAPI.onShowSetup(() => {
        document.getElementById('setup-overlay').classList.add('visible');
        document.getElementById('confirm-btn').disabled = false;
        document.getElementById('db-pass').focus();
        resizeSplash(510);
      });
    }
  </script>
</body>
</html>
