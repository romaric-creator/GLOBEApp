<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GLOBE Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px; height: 280px;
      background: #1c1c1c;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
      overflow: hidden;
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #C9A84C, #e8c96a);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 800;
      color: #1c1c1c;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(201,168,76,0.35);
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; }
    .subtitle { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 32px; }
    .bar-track {
      width: 220px; height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden;
      margin-bottom: 14px;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A84C, #e8c96a);
      border-radius: 2px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0%   { width: 0%;  margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%;  margin-left: 100%; }
    }
    #status { font-size: 11px; color: rgba(255,255,255,0.4); min-height: 16px; }
  </style>
</head>
<body>
  <div class="logo">G</div>
  <h1>GLOBE Manager</h1>
  <p class="subtitle">Gestion de résidence meublée</p>
  <div class="bar-track"><div class="bar-fill"></div></div>
  <p id="status">Initialisation...</p>

  <script>
    // Écouter les événements Tauri via l'API injectée
    if (window.__TAURI_INTERNALS__) {
      window.__TAURI_INTERNALS__.invoke && null; // no-op
      const { listen } = window.__TAURI_INTERNALS__;
      if (listen) {
        listen('splash-status', (event) => {
          document.getElementById('status').textContent = event.payload;
        });
      }
    }
    // Fallback : polling via fetch si Tauri pas encore prêt
    document.addEventListener('DOMContentLoaded', () => {
      if (window.__TAURI__) {
        window.__TAURI__.event.listen('splash-status', (event) => {
          document.getElementById('status').textContent = event.payload;
        });
      }
    });
  </script>
</body>
</html>
