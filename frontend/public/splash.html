<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GLOBE Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      background:
        radial-gradient(circle at top left,  rgba(201,168,76,0.13), transparent 40%),
        radial-gradient(circle at bottom right, rgba(28,28,28,0.05), transparent 35%),
        linear-gradient(135deg, #faf9f5 0%, #f5f2e8 50%, #fdfcf8 100%);
      color: #1c1c1c;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(201,168,76,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.07) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 90%);
      opacity: 0.5;
    }

    /* ── Splash chargement ────────────────────────────────── */
    .container {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px 32px;
      transition: opacity 0.2s;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.92); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      display: block;
      mix-blend-mode: multiply;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #1c1c1c;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 11px;
      color: rgba(28,28,28,0.4);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .progress-block {
      width: 100%;
      max-width: 300px;
    }

    .bar-track {
      width: 100%;
      height: 2px;
      background: rgba(201,168,76,0.18);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 11px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #b8932e, #e0bb58, #C9A84C);
      background-size: 200% 100%;
      animation: shimmer 1.7s linear infinite;
    }

    @keyframes shimmer {
      0%   { width: 0%;   margin-left: 0%;   background-position: 100% 0; }
      45%  { width: 55%;  margin-left: 15%;  background-position: 0%   0; }
      100% { width: 0%;   margin-left: 100%; background-position: 100% 0; }
    }

    #status {
      font-size: 11px;
      color: rgba(28,28,28,0.45);
      min-height: 15px;
      text-align: center;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A84C, transparent);
      margin: 14px auto 0;
      opacity: 0.5;
    }

    .log-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      padding: 6px 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2px;
      border-top: 1px solid rgba(201,168,76,0.12);
      background: rgba(245,242,232,0.6);
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .log-line {
      font-size: 9px;
      color: rgba(28,28,28,0.3);
      font-family: 'Cascadia Code', 'Consolas', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: fadein 0.2s ease;
    }

    .log-line.error { color: rgba(180,40,30,0.55); }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .version {
      position: absolute;
      top: 13px;
      right: 16px;
      font-size: 9px;
      color: rgba(28,28,28,0.22);
      letter-spacing: 0.4px;
      z-index: 10;
    }

    /* ── Overlay configuration premier lancement ──────────── */
    #setup-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background:
        radial-gradient(circle at top left,  rgba(201,168,76,0.13), transparent 40%),
        linear-gradient(135deg, #faf9f5 0%, #f5f2e8 50%, #fdfcf8 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 20px;
      animation: fadein 0.25s ease;
    }

    #setup-overlay.visible {
      display: flex;
    }

    .setup-title {
      font-size: 13px;
      font-weight: 700;
      color: #1c1c1c;
      margin-bottom: 4px;
      letter-spacing: -0.1px;
    }

    .setup-sub {
      font-size: 10px;
      color: rgba(28,28,28,0.4);
      margin-bottom: 20px;
      text-align: center;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1.5px solid rgba(201,168,76,0.35);
      border-radius: 8px;
      background: rgba(201,168,76,0.06);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .mode-btn:hover {
      border-color: #C9A84C;
      background: rgba(201,168,76,0.12);
    }

    .mode-btn.selected {
      border-color: #C9A84C;
      background: rgba(201,168,76,0.15);
    }

    .mode-btn .mode-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .mode-btn .mode-label {
      font-size: 10px;
      font-weight: 600;
      color: #1c1c1c;
      display: block;
    }

    .mode-btn .mode-desc {
      font-size: 9px;
      color: rgba(28,28,28,0.45);
      display: block;
      margin-top: 2px;
    }

    /* Zone saisie URL serveur */
    #client-config {
      display: none;
      width: 100%;
      margin-bottom: 10px;
      animation: fadein 0.2s ease;
    }

    #client-config.visible {
      display: block;
    }

    .url-label {
      font-size: 10px;
      color: rgba(28,28,28,0.5);
      margin-bottom: 5px;
      display: block;
    }

    .url-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #server-input {
      flex: 1;
      padding: 7px 10px;
      border: 1.5px solid rgba(201,168,76,0.3);
      border-radius: 6px;
      background: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #1c1c1c;
      outline: none;
      transition: border-color 0.15s;
    }

    #server-input:focus {
      border-color: #C9A84C;
    }

    #server-input.error {
      border-color: rgba(180,40,30,0.5);
    }

    #input-error {
      font-size: 9px;
      color: rgba(180,40,30,0.7);
      margin-top: 4px;
      min-height: 12px;
    }

    .confirm-btn {
      width: 100%;
      padding: 8px;
      background: linear-gradient(135deg, #C9A84C, #b8932e);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.3px;
    }

    .confirm-btn:hover { opacity: 0.9; }
    .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .setup-footer {
      font-size: 9px;
      color: rgba(28,28,28,0.25);
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <span class="version">v1.0.0</span>

  <!-- Splash chargement normal -->
  <div class="container" id="loading-view">
    <div class="logo-wrap">
      <img class="logo-img" src="logo.png" alt="GLOBE" />
    </div>
    <h1>GLOBE Manager</h1>
    <p class="subtitle">Résidence meublée</p>

    <div class="progress-block">
      <div class="bar-track"><div class="bar-fill"></div></div>
      <p id="status">Initialisation...</p>
    </div>

    <div class="divider"></div>
  </div>

  <div class="log-panel" id="log-panel"></div>

  <!-- Overlay configuration premier lancement -->
  <div id="setup-overlay">
    <p class="setup-title">Configuration initiale</p>
    <p class="setup-sub">Comment est utilisé ce poste ?</p>

    <div class="mode-buttons">
      <div class="mode-btn" id="btn-server" onclick="selectMode('server')">
        <div class="mode-icon">🖥️</div>
        <span class="mode-label">Serveur</span>
        <span class="mode-desc">Ce PC héberge la base de données</span>
      </div>
      <div class="mode-btn" id="btn-client" onclick="selectMode('client')">
        <div class="mode-icon">💻</div>
        <span class="mode-label">Poste client</span>
        <span class="mode-desc">Se connecter à un serveur existant</span>
      </div>
    </div>

    <div id="client-config">
      <label class="url-label" for="server-input">Adresse du serveur</label>
      <div class="url-row">
        <input
          id="server-input"
          type="text"
          placeholder="http://192.168.1.100:3001"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <p id="input-error"></p>
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirmSetup()" disabled>
      Valider et démarrer
    </button>

    <p class="setup-footer">Ce choix peut être réinitialisé depuis les paramètres</p>
  </div>

  <script>
    let selectedMode = null;

    function selectMode(mode) {
      selectedMode = mode;
      document.getElementById('btn-server').classList.toggle('selected', mode === 'server');
      document.getElementById('btn-client').classList.toggle('selected', mode === 'client');

      const clientConfig = document.getElementById('client-config');
      if (mode === 'client') {
        clientConfig.classList.add('visible');
        document.getElementById('server-input').focus();
      } else {
        clientConfig.classList.remove('visible');
      }

      updateConfirmState();
    }

    function updateConfirmState() {
      const btn = document.getElementById('confirm-btn');
      if (!selectedMode) { btn.disabled = true; return; }
      if (selectedMode === 'server') { btn.disabled = false; return; }
      const url = document.getElementById('server-input').value.trim();
      btn.disabled = url.length === 0;
    }

    document.getElementById('server-input').addEventListener('input', () => {
      document.getElementById('input-error').textContent = '';
      document.getElementById('server-input').classList.remove('error');
      updateConfirmState();
    });

    async function confirmSetup() {
      const btn = document.getElementById('confirm-btn');
      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      let serverUrl = null;
      if (selectedMode === 'client') {
        let raw = document.getElementById('server-input').value.trim();
        // Normaliser : ajouter http:// si absent, ajouter :3001 si pas de port
        if (!raw.startsWith('http://') && !raw.startsWith('https://')) {
          raw = 'http://' + raw;
        }
        try {
          const parsed = new URL(raw);
          if (!parsed.port) parsed.port = '3001';
          serverUrl = parsed.origin;
        } catch {
          document.getElementById('input-error').textContent = 'Adresse invalide';
          document.getElementById('server-input').classList.add('error');
          btn.disabled = false;
          btn.textContent = 'Valider et démarrer';
          return;
        }
      }

      try {
        const { invoke } = await import('@tauri-apps/api/core');
        const ok = await invoke('save_config', {
          config: {
            mode: selectedMode,
            server_url: serverUrl,
            configured: true,
          },
        });
        if (ok) {
          // Masquer l'overlay, laisser Rust continuer
          document.getElementById('setup-overlay').classList.remove('visible');
          document.getElementById('status').textContent = 'Configuration enregistrée...';
        } else {
          throw new Error('Échec de la sauvegarde');
        }
      } catch (e) {
        document.getElementById('input-error').textContent = 'Erreur : ' + e.message;
        btn.disabled = false;
        btn.textContent = 'Valider et démarrer';
      }
    }
  </script>

  <script type="module">
    const MAX_LINES = 4;
    const logPanel = document.getElementById('log-panel');
    const statusEl = document.getElementById('status');

    function addLog(msg, isError = false) {
      const line = document.createElement('div');
      line.className = 'log-line' + (isError ? ' error' : '');
      line.textContent = msg;
      logPanel.appendChild(line);
      while (logPanel.children.length > MAX_LINES) {
        logPanel.removeChild(logPanel.firstChild);
      }
    }

    try {
      const { listen } = await import('@tauri-apps/api/event');

      await listen('splash-status', (event) => {
        statusEl.textContent = event.payload;
      });

      await listen('app-log', (event) => {
        const msg = event.payload;
        const isError = /error|erreur|fail|impossible/i.test(msg);
        addLog(msg, isError);
      });

      await listen('show-setup', () => {
        document.getElementById('setup-overlay').classList.add('visible');
      });
    } catch (e) {
      statusEl.textContent = 'En attente de Tauri...';
      addLog('Tauri API indisponible: ' + e.message, true);
    }
  </script>
</body>
</html>
