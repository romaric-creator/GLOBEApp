<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>GLOBE Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      background:
        radial-gradient(circle at top left,  rgba(201,168,76,0.13), transparent 40%),
        radial-gradient(circle at bottom right, rgba(28,28,28,0.05), transparent 35%),
        linear-gradient(135deg, #faf9f5 0%, #f5f2e8 50%, #fdfcf8 100%);
      color: #1c1c1c;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(201,168,76,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.07) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 90%);
      opacity: 0.5;
    }

    /* ── Splash chargement ────────────────────────────────── */
    .container {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px 28px;
      transition: opacity 0.2s;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .logo-wrap::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.92); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      display: block;
      mix-blend-mode: multiply;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #1c1c1c;
      margin-bottom: 3px;
    }

    .subtitle {
      font-size: 11px;
      color: rgba(28,28,28,0.4);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .progress-block {
      width: 100%;
      max-width: 300px;
    }

    .bar-track {
      width: 100%;
      height: 2px;
      background: rgba(201,168,76,0.18);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #b8932e, #e0bb58, #C9A84C);
      background-size: 200% 100%;
      animation: shimmer 1.7s linear infinite;
    }

    @keyframes shimmer {
      0%   { width: 0%;   margin-left: 0%;   background-position: 100% 0; }
      45%  { width: 55%;  margin-left: 15%;  background-position: 0%   0; }
      100% { width: 0%;   margin-left: 100%; background-position: 100% 0; }
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      min-height: 15px;
      margin-bottom: 6px;
    }

    #status {
      font-size: 11px;
      color: rgba(28,28,28,0.45);
      flex: 1;
    }

    #elapsed {
      font-size: 10px;
      color: rgba(28,28,28,0.28);
      white-space: nowrap;
      margin-left: 8px;
    }

    /* ── Panneau détails (masqué par défaut) ──────────────── */
    .details-toggle {
      font-size: 10px;
      color: rgba(28,28,28,0.3);
      cursor: pointer;
      text-align: center;
      margin-top: 2px;
      letter-spacing: 0.2px;
      transition: color 0.15s;
    }
    .details-toggle:hover { color: rgba(28,28,28,0.55); }

    .log-panel {
      display: none;
      width: 100%;
      max-width: 300px;
      margin-top: 6px;
      background: rgba(28,28,28,0.04);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 5px;
      padding: 6px 8px;
      max-height: 100px;
      overflow-y: auto;
      user-select: text;
    }

    .log-panel.visible { display: block; }

    .copy-btn {
      font-size: 9px;
      color: rgba(28,28,28,0.3);
      cursor: pointer;
      margin-left: 8px;
      transition: color 0.15s;
    }
    .copy-btn:hover { color: #C9A84C; }

    .log-line {
      font-size: 9.5px;
      color: rgba(28,28,28,0.5);
      line-height: 1.5;
      font-family: 'Cascadia Code', 'Consolas', monospace;
    }

    .log-line .ts {
      color: rgba(28,28,28,0.25);
      margin-right: 4px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A84C, transparent);
      margin: 10px auto 0;
      opacity: 0.5;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .version {
      position: absolute;
      top: 13px;
      right: 16px;
      font-size: 9px;
      color: rgba(28,28,28,0.22);
      letter-spacing: 0.4px;
      z-index: 10;
    }

    /* ── Overlay configuration premier lancement ──────────── */
    #setup-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background:
        radial-gradient(circle at top left,  rgba(201,168,76,0.13), transparent 40%),
        linear-gradient(135deg, #faf9f5 0%, #f5f2e8 50%, #fdfcf8 100%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 32px 20px;
      animation: fadein 0.25s ease;
    }

    #setup-overlay.visible { display: flex; }

    .setup-title {
      font-size: 13px;
      font-weight: 700;
      color: #1c1c1c;
      margin-bottom: 4px;
      letter-spacing: -0.1px;
    }

    .setup-sub {
      font-size: 10px;
      color: rgba(28,28,28,0.4);
      margin-bottom: 20px;
      text-align: center;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1.5px solid rgba(201,168,76,0.35);
      border-radius: 8px;
      background: rgba(201,168,76,0.06);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .mode-btn:hover { border-color: #C9A84C; background: rgba(201,168,76,0.12); }
    .mode-btn.selected { border-color: #C9A84C; background: rgba(201,168,76,0.15); }

    .mode-btn .mode-icon  { margin-bottom: 6px; color: #C9A84C; display: flex; justify-content: center; }
    .mode-btn .mode-label { font-size: 10px; font-weight: 600; color: #1c1c1c; display: block; }
    .mode-btn .mode-desc  { font-size: 9px; color: rgba(28,28,28,0.45); display: block; margin-top: 2px; }

    #server-config, #client-config {
      display: none;
      width: 100%;
      margin-bottom: 10px;
      animation: fadein 0.2s ease;
    }
    #server-config.visible, #client-config.visible { display: block; }

    .url-label {
      font-size: 10px;
      color: rgba(28,28,28,0.5);
      margin-bottom: 5px;
      display: block;
    }

    .url-row { display: flex; gap: 6px; align-items: center; }

    #server-input {
      flex: 1;
      padding: 7px 10px;
      border: 1.5px solid rgba(201,168,76,0.3);
      border-radius: 6px;
      background: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #1c1c1c;
      outline: none;
      transition: border-color 0.15s;
    }
    #server-input:focus { border-color: #C9A84C; }
    #server-input.error { border-color: rgba(180,40,30,0.5); }

    .confirm-btn {
      width: 100%;
      padding: 8px;
      background: linear-gradient(135deg, #C9A84C, #b8932e);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.3px;
    }
    .confirm-btn:hover { opacity: 0.9; }
    .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .setup-footer {
      font-size: 9px;
      color: rgba(28,28,28,0.25);
      margin-top: 10px;
      text-align: center;
    }

    .setup-error {
      font-size: 10px;
      color: #b42a1e;
      background: rgba(180,42,30,0.06);
      border: 1px solid rgba(180,42,30,0.2);
      border-radius: 5px;
      padding: 6px 10px;
      margin-bottom: 8px;
      width: 100%;
      display: none;
      animation: fadein 0.2s ease;
    }
    .setup-error.visible { display: block; }

    .setup-success {
      font-size: 10px;
      color: #2e7d32;
      background: rgba(46,125,50,0.06);
      border: 1px solid rgba(46,125,50,0.2);
      border-radius: 5px;
      padding: 6px 10px;
      margin-bottom: 8px;
      width: 100%;
      display: none;
      animation: fadein 0.2s ease;
    }
    .setup-success.visible { display: block; }

    .confirm-btn.testing {
      background: linear-gradient(135deg, #888, #666);
      cursor: wait;
    }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <span class="version">v1.0.0</span>

  <!-- Splash chargement normal -->
  <div class="container" id="loading-view">
    <div class="logo-wrap">
      <img class="logo-img" src="logo.png" alt="GLOBE" />
    </div>
    <h1>GLOBE Manager</h1>
    <p class="subtitle">Résidence meublée</p>

    <div class="progress-block">
      <div class="bar-track"><div class="bar-fill"></div></div>

      <div class="status-row">
        <p id="status">Chargement des données...</p>
        <span id="elapsed"></span>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;">
        <div class="details-toggle" id="details-toggle" onclick="toggleDetails()">Détails ▾</div>
        <span class="copy-btn" id="copy-btn" onclick="copyLogs()" title="Copier les logs">copier</span>
      </div>
      <div class="log-panel" id="log-panel"></div>
    </div>

    <div class="divider"></div>
  </div>

  <!-- Overlay configuration premier lancement -->
  <div id="setup-overlay">
    <p class="setup-title">Configuration initiale</p>
    <p class="setup-sub">Comment est utilisé ce poste ?</p>

    <div class="mode-buttons">
      <div class="mode-btn" id="btn-server" onclick="selectMode('server')">
        <div class="mode-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2"/>
            <circle cx="6" cy="6" r="1" fill="currentColor"/>
            <circle cx="6" cy="18" r="1" fill="currentColor"/>
            <line x1="10" y1="6" x2="18" y2="6" opacity="0.5"/>
            <line x1="10" y1="18" x2="18" y2="18" opacity="0.5"/>
          </svg>
        </div>
        <span class="mode-label">Serveur</span>
        <span class="mode-desc">Ce PC héberge la base de données</span>
      </div>
      <div class="mode-btn" id="btn-client" onclick="selectMode('client')">
        <div class="mode-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/>
            <line x1="7" y1="20" x2="17" y2="20"/>
            <line x1="12" y1="16" x2="12" y2="20"/>
            <path d="M7 9l3 3-3 3" opacity="0.6"/>
            <line x1="12" y1="12" x2="16" y2="12" opacity="0.4"/>
          </svg>
        </div>
        <span class="mode-label">Poste client</span>
        <span class="mode-desc">Se connecter à un serveur existant</span>
      </div>
    </div>

    <div id="server-config">
      <label class="url-label">Connexion MySQL</label>
      <div style="display:flex;gap:5px;margin-bottom:5px;">
        <input id="db-host" type="text" placeholder="localhost" value="localhost" autocomplete="off" spellcheck="false" style="flex:3;padding:6px 10px;border:1.5px solid rgba(201,168,76,0.3);border-radius:6px;background:rgba(255,255,255,0.7);font-size:11px;font-family:'Cascadia Code',monospace;outline:none;" />
        <input id="db-port" type="text" placeholder="3306" value="3306" autocomplete="off" style="flex:1;padding:6px 10px;border:1.5px solid rgba(201,168,76,0.3);border-radius:6px;background:rgba(255,255,255,0.7);font-size:11px;font-family:'Cascadia Code',monospace;outline:none;" />
      </div>
      <div style="display:flex;gap:5px;margin-bottom:5px;">
        <input id="db-user" type="text" placeholder="Utilisateur (globe)" value="globe" autocomplete="off" style="flex:1;padding:6px 10px;border:1.5px solid rgba(201,168,76,0.3);border-radius:6px;background:rgba(255,255,255,0.7);font-size:11px;font-family:'Cascadia Code',monospace;outline:none;" />
        <input id="db-pass" type="password" placeholder="Mot de passe" autocomplete="off" style="flex:1;padding:6px 10px;border:1.5px solid rgba(201,168,76,0.3);border-radius:6px;background:rgba(255,255,255,0.7);font-size:11px;font-family:'Cascadia Code',monospace;outline:none;" />
      </div>
      <input id="db-name" type="text" placeholder="Base (gestion_residence)" value="gestion_residence" autocomplete="off" spellcheck="false" style="width:100%;padding:6px 10px;border:1.5px solid rgba(201,168,76,0.3);border-radius:6px;background:rgba(255,255,255,0.7);font-size:11px;font-family:'Cascadia Code',monospace;outline:none;margin-bottom:5px;" />
    </div>

    <div id="client-config">
      <label class="url-label" for="server-input">Adresse du serveur</label>
      <div class="url-row">
        <input
          id="server-input"
          type="text"
          placeholder="http://192.168.1.100:3001"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>

    <div class="setup-error" id="setup-error"></div>
    <div class="setup-success" id="setup-success"></div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirmSetup()" disabled>
      Valider et démarrer
    </button>

    <p class="setup-footer">Ce choix peut être réinitialisé depuis les paramètres</p>
  </div>

  <script>
    // ── Chronomètre ──────────────────────────────────────────
    const startTime = Date.now();
    const elapsedEl = document.getElementById('elapsed');

    function updateElapsed() {
      const secs = Math.floor((Date.now() - startTime) / 1000);
      if (secs < 5) { elapsedEl.textContent = ''; return; }
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      elapsedEl.textContent = m > 0
        ? `${m} min ${String(s).padStart(2, '0')} s`
        : `${s} s`;
    }
    setInterval(updateElapsed, 1000);

    // ── Panneau détails ──────────────────────────────────────
    let detailsOpen = false;
    const logLines = [];

    function toggleDetails() {
      detailsOpen = !detailsOpen;
      document.getElementById('log-panel').classList.toggle('visible', detailsOpen);
      document.getElementById('details-toggle').textContent = detailsOpen ? 'Détails ▴' : 'Détails ▾';
    }

    function addLog(msg) {
      const secs = Math.floor((Date.now() - startTime) / 1000);
      const ts = secs < 60 ? `${secs}s` : `${Math.floor(secs/60)}m${secs%60}s`;
      logLines.push({ ts, msg });

      const panel = document.getElementById('log-panel');
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="ts">[${ts}]</span>${msg}`;
      panel.appendChild(line);
      panel.scrollTop = panel.scrollHeight;

      if (logLines.length > 3 && !detailsOpen) {
        toggleDetails();
      }
    }

    function copyLogs() {
      const text = logLines.map(l => `[${l.ts}] ${l.msg}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('copy-btn').textContent = 'copié !';
        setTimeout(() => { document.getElementById('copy-btn').textContent = 'copier'; }, 2000);
      });
    }

    // ── Sélection mode ────────────────────────────────────────
    let selectedMode = null;

    function selectMode(mode) {
      selectedMode = mode;
      document.getElementById('btn-server').classList.toggle('selected', mode === 'server');
      document.getElementById('btn-client').classList.toggle('selected', mode === 'client');

      document.getElementById('server-config').classList.toggle('visible', mode === 'server');
      document.getElementById('client-config').classList.toggle('visible', mode === 'client');

      if (mode === 'client') {
        document.getElementById('server-input').focus();
      } else if (mode === 'server') {
        document.getElementById('db-pass').focus();
      }
      updateConfirmState();
    }

    function updateConfirmState() {
      const btn = document.getElementById('confirm-btn');
      if (!selectedMode) { btn.disabled = true; return; }
      if (selectedMode === 'server') {
        const pass = document.getElementById('db-pass').value.trim();
        btn.disabled = pass.length === 0;
        return;
      }
      btn.disabled = document.getElementById('server-input').value.trim().length === 0;
    }

    document.getElementById('server-input').addEventListener('input', () => {
      document.getElementById('server-input').classList.remove('error');
      hideSetupMessages();
      updateConfirmState();
    });

    ['db-host', 'db-port', 'db-user', 'db-pass', 'db-name'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        hideSetupMessages();
        updateConfirmState();
      });
    });

    function showSetupError(msg) {
      const el = document.getElementById('setup-error');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('setup-success').classList.remove('visible');
    }

    function showSetupSuccess(msg) {
      const el = document.getElementById('setup-success');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('setup-error').classList.remove('visible');
    }

    function hideSetupMessages() {
      document.getElementById('setup-error').classList.remove('visible');
      document.getElementById('setup-success').classList.remove('visible');
    }

    function setButtonState(state) {
      const btn = document.getElementById('confirm-btn');
      btn.classList.remove('testing');
      switch (state) {
        case 'idle':
          btn.disabled = false;
          btn.innerHTML = 'Valider et démarrer';
          break;
        case 'testing':
          btn.disabled = true;
          btn.classList.add('testing');
          btn.innerHTML = '<span class="spinner"></span>Test de connexion...';
          break;
        case 'saving':
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span>Enregistrement...';
          break;
        case 'disabled':
          btn.disabled = true;
          btn.innerHTML = 'Valider et démarrer';
          break;
      }
    }

    function buildDbUrl() {
      const host = document.getElementById('db-host').value.trim() || 'localhost';
      const port = document.getElementById('db-port').value.trim() || '3306';
      const user = document.getElementById('db-user').value.trim() || 'globe';
      const pass = document.getElementById('db-pass').value.trim();
      const dbName = document.getElementById('db-name').value.trim() || 'gestion_residence';

      const portNum = parseInt(port, 10);
      if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
        return { error: 'Le port doit être un nombre entre 1 et 65535' };
      }

      return {
        url: `mysql://${user}:${encodeURIComponent(pass)}@${host}:${portNum}/${dbName}`,
        host, port: portNum, user, dbName,
      };
    }

    async function confirmSetup() {
      hideSetupMessages();

      let config = { mode: selectedMode, configured: true };

      if (selectedMode === 'server') {
        const dbInfo = buildDbUrl();
        if (dbInfo.error) {
          showSetupError(dbInfo.error);
          return;
        }

        setButtonState('testing');

        try {
          const result = await window.electronAPI.testDbConnection(dbInfo.url);
          if (!result.ok) {
            const hint = result.error || '';
            let msg = 'Connexion à MySQL échouée.';
            if (hint.includes('ECONNREFUSED')) {
              msg += ` Impossible de joindre ${dbInfo.host}:${dbInfo.port}. Vérifiez que MySQL est démarré.`;
            } else if (hint.includes('Access denied')) {
              msg += ' Identifiants incorrects (utilisateur ou mot de passe).';
            } else if (hint.includes('Unknown database')) {
              msg += ` La base "${dbInfo.dbName}" n'existe pas. Créez-la d'abord.`;
            } else if (hint.includes('ETIMEDOUT') || hint.includes('timeout')) {
              msg += ` Délai dépassé pour ${dbInfo.host}:${dbInfo.port}. Vérifiez l'hôte et le port.`;
            } else if (hint) {
              msg += ' ' + hint;
            }
            showSetupError(msg);
            setButtonState('idle');
            return;
          }
        } catch (e) {
          showSetupError('Erreur inattendue lors du test : ' + (e.message || e));
          setButtonState('idle');
          return;
        }

        showSetupSuccess('Connexion réussie !');
        setButtonState('saving');

        config.database_url = dbInfo.url;
        config.port = 3001;

      } else {
        let raw = document.getElementById('server-input').value.trim();
        if (!raw.startsWith('http://') && !raw.startsWith('https://')) raw = 'http://' + raw;
        try {
          const parsed = new URL(raw);
          if (!parsed.port) parsed.port = '3001';
          config.server_url = parsed.origin;
        } catch {
          showSetupError('Adresse invalide. Exemple : http://192.168.1.100:3001');
          document.getElementById('server-input').classList.add('error');
          return;
        }
        setButtonState('saving');
      }

      try {
        if (window.electronAPI) {
          window.electronAPI.setupComplete(config);
        }
        document.getElementById('setup-overlay').classList.remove('visible');
        document.getElementById('status').textContent = 'Configuration enregistrée...';
        addLog('Configuration enregistrée');
      } catch (e) {
        showSetupError('Impossible de sauvegarder : ' + (e.message || e));
        setButtonState('idle');
      }
    }
  </script>

  <script>
    const statusEl = document.getElementById('status');

    if (window.electronAPI) {
      window.electronAPI.onSplashStatus((msg) => {
        statusEl.textContent = msg;
        addLog(msg);
      });

      window.electronAPI.onSplashDetail((msg) => {
        addLog(msg);
      });

      window.electronAPI.onShowSetup(() => {
        document.getElementById('setup-overlay').classList.add('visible');
      });
    }
  </script>
</body>
</html>
